version: "3.1"

# ============================================================
# Calisto Eyewear – Domain
# ============================================================

# ────────────────────────────────────────────────────────────
# INTENTS
# ────────────────────────────────────────────────────────────
intents:
  - greet
  - goodbye
  - ask_product
  - search_frames
  - recommend_frames
  - ask_lens_types
  - ask_lens_price
  - ask_store_location
  - book_eye_test
  - track_order
  - check_face_shape
  - affirm
  - deny
  - inform
  - out_of_scope
  - nlu_fallback

# ────────────────────────────────────────────────────────────
# ENTITIES
# ────────────────────────────────────────────────────────────
entities:
  - product_type
  - frame_style
  - gender
  - face_shape
  - lens_type
  - order_id
  - city
  - budget

# ────────────────────────────────────────────────────────────
# SLOTS
# ────────────────────────────────────────────────────────────
slots:
  product_type:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: product_type

  frame_style:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: frame_style

  gender:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: gender

  face_shape:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: face_shape

  lens_type:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: lens_type

  order_id:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: order_id

  city:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: city

  budget:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: budget

  appointment_date:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: eye_test_form
            requested_slot: appointment_date

  appointment_time:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: eye_test_form
            requested_slot: appointment_time

# ────────────────────────────────────────────────────────────
# RESPONSES
# ────────────────────────────────────────────────────────────
responses:

  utter_greet:
    - text: |
        Welcome to Calisto Eyewear! 👓 I'm your personal eyewear assistant.

        I can help you with:
        • 🕶️  Browse & find Frames
        • 🔬  Lens types & pricing
        • 🗺️  Store locations
        • 📦  Order tracking
        • 👁️  Book an eye test

        What are you looking for today?

  utter_goodbye:
    - text: "Thank you for visiting Calisto Eyewear! See you soon. 👋"
    - text: "Goodbye! Great vision starts with great eyewear. 😊 Come back anytime!"

  utter_ask_product_type:
    - text: "What type of eyewear are you looking for?\n\n• Eyeglasses\n• Sunglasses\n• Computer / Blue Light Glasses\n• Reading Glasses\n• Sports Glasses"

  utter_ask_frame_style:
    - text: "What frame style do you prefer?\n\n• Round  • Square  • Rectangular\n• Cat-eye  • Aviator  • Oval  • Wayfarer"

  utter_ask_gender:
    - text: "Are you looking for **men's**, **women's**, or **unisex** frames?"

  utter_ask_face_shape:
    - text: "What's your face shape?\n(Round, Oval, Square, Heart, Diamond, or Oblong)\n\nNot sure? Just say *help me find my face shape* and I'll guide you! 😊"

  utter_ask_budget:
    - text: "What's your budget range?\n\n• Under ₹1,500\n• ₹1,500 – ₹3,000\n• ₹3,000 – ₹6,000\n• Above ₹6,000"

  utter_ask_order_id:
    - text: "Please share your **Order ID** so I can check the status for you.\n(e.g. 45821, ORD12345, or CAL-2024-9876)"

  utter_ask_city:
    - text: "Which city are you in? I'll find the nearest Calisto store for you. 🏙️"

  utter_ask_appointment_date:
    - text: "What **date** would you like for your eye test?\n(e.g. 15 March, next Monday, this Saturday)"

  utter_ask_appointment_time:
    - text: "What **time** works best for you?\n(e.g. 10:00 AM, 2:30 PM)"

  utter_lens_types_info:
    - text: |
        We offer a wide range of lenses at Calisto Eyewear:

        👁️  **Single Vision** – Corrects near or distance vision
        👁️  **Bifocal** – Two zones: near + distance (visible line)
        👁️  **Progressive** – Seamless multi-focal (no visible lines)
        💡  **Blue Light Blocking** – Shields from digital screen strain
        🌞  **Photochromic (Transitions)** – Auto-darkens in sunlight
        ✨  **Anti-Glare (AR Coat)** – Reduces reflections for clear vision
        🌊  **Polarized** – Best for driving & outdoor use
        🛡️  **UV400** – Blocks 100% UVA + UVB rays

        Would you like to see **pricing** for any of these?

  utter_lens_price_info:
    - text: |
        Here's our lens pricing guide:

        | Lens Type            | Starting Price  |
        |----------------------|-----------------|
        | Single Vision        | ₹499            |
        | Bifocal              | ₹899            |
        | Progressive          | ₹2,499          |
        | Blue Light Blocking  | ₹799            |
        | Photochromic         | ₹1,999          |
        | Anti-Glare Coating   | ₹299 (add-on)   |
        | Polarized            | ₹1,499          |
        | UV400 Coating        | ₹199 (add-on)   |

        All prices include professional fitting. Would you like to **book an eye test**?

  utter_store_locations:
    - text: |
        🏪 **Calisto Eyewear Stores:**

        **Mumbai**
        • Linking Road, Bandra West – 10AM–9PM
        • Phoenix Market City, Kurla – 10AM–10PM

        **Delhi**
        • Connaught Place (Inner Circle) – 10AM–9PM
        • Select City Walk, Saket – 11AM–9PM

        **Bangalore**
        • Brigade Road – 10AM–9PM
        • 100ft Road, Indiranagar – 10AM–9PM

        **Chennai**
        • Usman Road, T. Nagar – 10AM–8:30PM

        **Hyderabad**
        • Road No. 12, Banjara Hills – 10AM–9PM

        📍 Type your city and I'll give you the exact store address!

  utter_eye_test_booked:
    - text: |
        ✅ **Eye Test Booked at Calisto Eyewear!**

        📅 Date: {appointment_date}
        ⏰ Time: {appointment_time}
        📍 City: {city}

        You'll receive a confirmation SMS & email shortly.
        Please carry your previous prescription (if available). See you there! 👓

  utter_check_face_shape_help:
    - text: |
        Here's a quick guide to identifying your face shape:

        🔵 **Round** – Equal width & length, soft curves
           → Best frames: Square, Rectangular, Wayfarer

        🥚 **Oval** – Slightly wider forehead, balanced proportions
           → Best frames: Almost any style works! Try Aviators or Wayfarers

        🟥 **Square** – Strong jawline & broad forehead
           → Best frames: Round, Oval, Cat-eye

        💜 **Heart** – Wider forehead, narrow chin
           → Best frames: Bottom-heavy, Aviator, Rectangular

        💎 **Diamond** – Narrow forehead & chin, wide cheekbones
           → Best frames: Oval, Cat-eye, Rimless

        📏 **Oblong** – Longer than it is wide
           → Best frames: Wide frames, Aviator, Square

        Tell me your face shape and I'll recommend the perfect Calisto frames! 😊

  utter_recommend_frames_prompt:
    - text: "I'd love to help you find your perfect frames! Let me ask a couple of quick questions. 😊"

  utter_fallback:
    - text: "I'm sorry, I didn't quite catch that. 🤔 Could you rephrase?\n\nI can help with: frames, lenses, store locations, order tracking, or eye test bookings."
    - text: "Hmm, I'm not sure I understood. Could you try asking differently? I can help with Calisto eyewear, lenses, orders, or store visits!"

  utter_out_of_scope:
    - text: "That's a bit outside my expertise! 😅 I'm here to help with all things Calisto Eyewear — frames, lenses, stores, and orders. How can I assist?"

# ────────────────────────────────────────────────────────────
# FORMS
# ────────────────────────────────────────────────────────────
forms:
  frame_search_form:
    required_slots:
      - product_type
      - frame_style
      - gender
      - budget

  order_tracking_form:
    required_slots:
      - order_id

  eye_test_form:
    required_slots:
      - city
      - appointment_date
      - appointment_time

# ────────────────────────────────────────────────────────────
# CUSTOM ACTIONS
# ────────────────────────────────────────────────────────────
actions:
  - action_recommend_frames
  - action_check_order_status
  - action_find_nearest_store
  - validate_frame_search_form
  - validate_order_tracking_form
  - validate_eye_test_form

# ────────────────────────────────────────────────────────────
# SESSION CONFIG
# ────────────────────────────────────────────────────────────
session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
