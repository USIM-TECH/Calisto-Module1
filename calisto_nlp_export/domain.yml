version: "3.1"

intents:
  - greet
  - browse_eyewear
  - ask_faq
  - ask_pricing
  - select_pricing_category
  - select_product_type
  - select_brand
  - select_budget
  - ask_lens_type
  - lens_vision_solutions
  - find_a_store
  - store_hours
  - choose_city
  - search_product
  - search_product_by_attribute
  - product_recommendation
  - inform_budget
  - capture_lead
  - share_name
  - share_phone
  - share_email
  - share_location
  - share_service_interest
  - share_timeline
  - book_appointment
  - reschedule_appointment
  - after_sales_support
  - order_tracking
  - warranty_claim
  - human_handoff
  - affirm
  - deny

entities:
  - product_type
  - brand
  - price_range
  - lens_type
  - city
  - use_case
  - urgency
  - order_id
  - frame_color
  - frame_shape
  - frame_material
  - budget
  - budget_min
  - budget_max
  - budget_bucket
  - lead_name
  - contact_number
  - email
  - lead_location
  - preferred_service
  - purchase_timeline

slots:
  product_type:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: product_type
  brand:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: brand
  price_range:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: price_range
  lens_type:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: lens_type
  city:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: city
  use_case:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: use_case
  urgency:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: urgency
  order_id:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: order_id
  frame_color:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: frame_color
  frame_shape:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: frame_shape
  frame_material:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: frame_material
  budget:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: budget
  budget_min:
    type: float
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: budget_min
  budget_max:
    type: float
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: budget_max
  budget_bucket:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: budget_bucket
  lead_name:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: lead_name
        conditions:
          - active_loop: lead_capture_form
            requested_slot: lead_name
      - type: from_text
        conditions:
          - active_loop: lead_capture_form
            requested_slot: lead_name
  contact_number:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: contact_number
        conditions:
          - active_loop: lead_capture_form
            requested_slot: contact_number
      - type: from_text
        conditions:
          - active_loop: lead_capture_form
            requested_slot: contact_number
  email:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: email
        conditions:
          - active_loop: lead_capture_form
            requested_slot: email
      - type: from_text
        conditions:
          - active_loop: lead_capture_form
            requested_slot: email
  lead_location:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: lead_location
        conditions:
          - active_loop: lead_capture_form
            requested_slot: lead_location
      - type: from_entity
        entity: city
        conditions:
          - active_loop: lead_capture_form
            requested_slot: lead_location
      - type: from_text
        conditions:
          - active_loop: lead_capture_form
            requested_slot: lead_location
  preferred_service:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: preferred_service
        conditions:
          - active_loop: lead_capture_form
            requested_slot: preferred_service
      - type: from_entity
        entity: product_type
        conditions:
          - active_loop: lead_capture_form
            requested_slot: preferred_service
      - type: from_text
        conditions:
          - active_loop: lead_capture_form
            requested_slot: preferred_service
  purchase_timeline:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: purchase_timeline
        conditions:
          - active_loop: lead_capture_form
            requested_slot: purchase_timeline
      - type: from_text
        conditions:
          - active_loop: lead_capture_form
            requested_slot: purchase_timeline
  preferred_language:
    type: text
    influence_conversation: false
    mappings:
      - type: custom
  lead_status:
    type: text
    influence_conversation: false
    mappings:
      - type: custom
  current_flow:
    type: text
    influence_conversation: true
    mappings:
      - type: custom

forms:
  lead_capture_form:
    ignored_intents:
      - ask_faq
      - ask_pricing
      - select_pricing_category
      - browse_eyewear
      - select_product_type
      - select_brand
      - select_budget
      - ask_lens_type
      - lens_vision_solutions
      - find_a_store
      - store_hours
      - choose_city
      - search_product
      - search_product_by_attribute
      - product_recommendation
      - inform_budget
    required_slots:
      - lead_name
      - contact_number
      - email
      - lead_location
      - preferred_service
      - purchase_timeline

