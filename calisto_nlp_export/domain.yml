version: "3.1"

# ============================================================
# Calisto Eyewear (Malaysia) - Domain
# ============================================================

# INTENTS
intents:
  - greet
  - goodbye
  - ask_product
  - search_frames
  - recommend_frames
  - ask_lens_types
  - ask_lens_price
  - ask_store_location
  - book_eye_test
  - track_order
  - check_face_shape
  - ask_warranty
  - ask_return_exchange
  - ask_payment_options
  - ask_company_info
  - ask_services
  - ask_product_info
  - thank_you
  - affirm
  - deny
  - inform
  - out_of_scope
  - nlu_fallback

# ENTITIES
entities:
  - product_type
  - face_shape
  - lens_type
  - order_id
  - city
  - budget

# SLOTS
slots:
  product_type:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: product_type
      - type: from_text
        conditions:
          - active_loop: frame_search_form
            requested_slot: product_type

  face_shape:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: face_shape

  lens_type:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: lens_type

  order_id:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: order_id

  city:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: city

  budget:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: budget
      - type: from_text
        conditions:
          - active_loop: frame_search_form
            requested_slot: budget

  appointment_date:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: eye_test_form
            requested_slot: appointment_date

  appointment_time:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: eye_test_form
            requested_slot: appointment_time

# RESPONSES
responses:

  utter_greet:
    - text: |
        Selamat datang to Calisto Eyewear! 👓 I'm your personal eyewear assistant.

        I can help you with:
        • �️  Browse products & categories
        • 🔬  Lens types & pricing
        • 🗺️  Store locations in Malaysia
        • 📦  Order tracking
        • 👁️  Book an eye test
        • 💳  Payment & warranty info

        Nak tahu apa hari ni? / What are you looking for today?

  utter_goodbye:
    - text: "Terima kasih for visiting Calisto Eyewear! Jumpa lagi soon. 👋"
    - text: "Goodbye! Great vision starts with great eyewear. 😊 Come back anytime! Terima kasih!"

  utter_fallback:
    - text: "Sorry, I tak berapa faham tu. 🤔 Boleh rephrase?\n\nI can help with: products, lenses, store locations, order tracking, eye test bookings, warranty & payments."
    - text: "Hmm, I'm not sure I understood. Cuba tanya cara lain? I boleh tolong dengan Calisto eyewear, lenses, orders, or store visits!"

  utter_out_of_scope:
    - text: "That's a bit outside my expertise lah! 😅 I'm here to help with all things Calisto Eyewear — products, lenses, stores, orders & more. How can I assist?"

  utter_thank_you:
    - text: "Sama-sama! 😊 Happy to help. Ada apa-apa lagi nak tanya?"
    - text: "You're welcome! Glad I could help. Anything else about Calisto Eyewear?"

# FORMS
forms:
  frame_search_form:
    required_slots:
      - product_type
      - budget

  order_tracking_form:
    required_slots:
      - order_id

  eye_test_form:
    required_slots:
      - city
      - appointment_date
      - appointment_time

# CUSTOM ACTIONS
actions:
  - action_show_product_overview
  - action_show_lens_types
  - action_show_lens_pricing
  - action_show_face_shape_help
  - action_show_warranty_info
  - action_show_return_exchange_info
  - action_show_payment_options_info
  - action_show_recommend_frames_prompt
  - action_confirm_eye_test_booking
  - action_ask_frame_search_form_product_type
  - action_ask_frame_search_form_budget
  - action_ask_order_tracking_form_order_id
  - action_ask_eye_test_form_city
  - action_ask_eye_test_form_appointment_date
  - action_ask_eye_test_form_appointment_time
  - action_recommend_frames
  - action_check_order_status
  - action_find_nearest_store
  - validate_frame_search_form
  - validate_order_tracking_form
  - validate_eye_test_form
  - action_document_search
