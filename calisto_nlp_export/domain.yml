version: "3.1"

intents:
  - greet
  - browse_eyewear
  - search_product
  - ask_faq
  - ask_pricing
  - select_product_type
  - select_brand
  - select_budget
  - ask_lens_type
  - lens_vision_solutions
  - find_a_store
  - choose_city
  - search_product_by_attribute
  - inform_budget
  - capture_lead
  - share_name
  - share_phone
  - share_email
  - share_location
  - share_service_interest
  - share_timeline
  - book_appointment
  - after_sales_support
  - affirm
  - deny

entities:
  - product_type
  - brand
  - price_range
  - lens_type
  - city
  - frame_color
  - frame_shape
  - frame_material
  - budget
  - lead_name
  - contact_number
  - email
  - lead_location
  - preferred_service
  - purchase_timeline

slots:
  product_type:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: product_type
  brand:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: brand
  price_range:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: price_range
  lens_type:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: lens_type
  city:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: city
  frame_color:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: frame_color
  frame_shape:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: frame_shape
  frame_material:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: frame_material
  budget:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: budget
  lead_name:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: lead_name
      - type: from_text
        conditions:
          - active_loop: lead_capture_form
            requested_slot: lead_name
  contact_number:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: contact_number
      - type: from_text
        conditions:
          - active_loop: lead_capture_form
            requested_slot: contact_number
  email:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: email
      - type: from_text
        conditions:
          - active_loop: lead_capture_form
            requested_slot: email
  lead_location:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: lead_location
      - type: from_entity
        entity: city
      - type: from_text
        conditions:
          - active_loop: lead_capture_form
            requested_slot: lead_location
  preferred_service:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: preferred_service
      - type: from_entity
        entity: product_type
      - type: from_text
        conditions:
          - active_loop: lead_capture_form
            requested_slot: preferred_service
  purchase_timeline:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: purchase_timeline
      - type: from_text
        conditions:
          - active_loop: lead_capture_form
            requested_slot: purchase_timeline
  lead_status:
    type: text
    influence_conversation: true
    mappings:
      - type: custom

forms:
  lead_capture_form:
    required_slots:
      - lead_name
      - contact_number
      - email
      - lead_location
      - preferred_service
      - purchase_timeline

responses:
  utter_greet:
    - text: "Selamat datang to Calisto Eyewear.\nI can help you discover products, check pricing, find a store, or arrange a consultation. What would you like to do first?"
      buttons:
        - title: Browse Eyewear
          payload: /browse_eyewear
        - title: Check Pricing
          payload: /ask_pricing
        - title: Book Appointment
          payload: /book_appointment

  utter_pricing_intro:
    - text: "Sure. I can help with pricing for frames, sunglasses, contact lenses, and lens upgrades. Which category do you want pricing for?"
      buttons:
        - title: Frames
          payload: /share_service_interest{"preferred_service":"Designer Frames"}
        - title: Sunglasses
          payload: /share_service_interest{"preferred_service":"Luxury Sunglasses"}
        - title: Lenses
          payload: /share_service_interest{"preferred_service":"Lens Consultation"}

  utter_ask_product_type:
    - text: "Great. What are you shopping for today?"
      buttons:
        - title: Designer Frames
          payload: /select_product_type{"product_type":"Designer Frames"}
        - title: Luxury Sunglasses
          payload: /select_product_type{"product_type":"Luxury Sunglasses"}
        - title: Contact Lenses
          payload: /select_product_type{"product_type":"Contact Lenses"}

  utter_ask_budget_range:
    - text: "To narrow this down properly, what budget range are you comfortable with?"
      buttons:
        - title: Under RM100
          payload: /select_budget{"price_range":"Under RM100"}
        - title: RM100 - RM250
          payload: /select_budget{"price_range":"RM100 - RM250"}
        - title: RM250 - RM300
          payload: /select_budget{"price_range":"RM250 - RM300"}
        - title: Above RM300
          payload: /select_budget{"price_range":"Above RM300"}

  utter_ask_try_frames:
    - text: "Would you like to try these frames at a Calisto store?"
      buttons:
        - title: Find Nearest Store
          payload: /find_a_store
        - title: Book Appointment
          payload: /book_appointment
        - title: Talk to Consultant
          payload: /capture_lead

  utter_ask_lens_type:
    - text: "Which lens solution would you like help with?"
      buttons:
        - title: Single Vision
          payload: /ask_lens_type{"lens_type":"Single Vision Lenses"}
        - title: Progressive
          payload: /ask_lens_type{"lens_type":"Progressive Lenses"}
        - title: Blue Light
          payload: /ask_lens_type{"lens_type":"Blue Light Protection"}

  utter_ask_city:
    - text: "Which city or mall should I check for you?"

  utter_next_step_product_help:
    - text: "I can help you shortlist more options, find a nearby store, or arrange a consultation."

  utter_next_step_lens_help:
    - text: "If you want, I can help you compare more lens options, find a store, or arrange a consultation."

  utter_booking_intro:
    - text: "I can help you book an appointment for an eye test, fitting, or consultation. Before I do that, I just need a few contact details so our team can reach you."

  utter_after_sales_intro:
    - text: "I can help with warranty, fitting adjustments, order follow-up, or general after-sales support. Before we continue, I need a few contact details so the right team can follow up."

  utter_ask_lead_name:
    - text: "First, may I have your name?"
  utter_ask_contact_number:
    - text: "What is the best WhatsApp or phone number for our team to reach you on?"
  utter_ask_email:
    - text: "What email address should we use for quotations or follow-up?"
  utter_ask_lead_location:
    - text: "Which area or city are you located in, so we can route you to the right team or store?"
  utter_ask_preferred_service:
    - text: "What are you mainly interested in today?"
      buttons:
        - title: Eyewear Recommendation
          payload: /share_service_interest{"preferred_service":"Eyewear Recommendation"}
        - title: Lens Consultation
          payload: /share_service_interest{"preferred_service":"Lens Consultation"}
        - title: Store Visit
          payload: /share_service_interest{"preferred_service":"Store Visit"}
        - title: After-sales Support
          payload: /share_service_interest{"preferred_service":"After-sales Support"}
  utter_ask_purchase_timeline:
    - text: "How soon are you planning to make a decision or visit a store?"
      buttons:
        - title: This Week
          payload: /share_timeline{"purchase_timeline":"This Week"}
        - title: Within 2 Weeks
          payload: /share_timeline{"purchase_timeline":"Within 2 Weeks"}
        - title: Just Exploring
          payload: /share_timeline{"purchase_timeline":"Just Exploring"}

  utter_lead_capture_complete:
    - text: "Thanks. I have your contact details and our team will follow up shortly."

  utter_lead_not_qualified:
    - text: "Thank you. We have captured your inquiry and our team will review the best next step for you."

  utter_explain_lens:
    - text: "Here is more information about {lens_type}."

actions:
  - action_ask_city
  - action_ask_brand
  - action_filter_products
  - action_explain_lens
  - action_find_store
  - action_prefill_lead_capture
  - action_reset_eyewear_slots
  - action_document_search
  - action_search_product_by_attribute
  - action_filter_lenses
  - validate_lead_capture_form
  - action_qualify_lead
  - action_submit_lead_capture

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
