# ============================================================
# Calisto Eyewear (Malaysia) - Rasa NLU + Core Configuration
# ============================================================
# Run: rasa train   |   Chat: rasa shell
# Serve actions: rasa run actions
# ============================================================

recipe: default.v1

# Supports English + Manglish + Bahasa Melayu mixed input
language: en

# NLU PIPELINE (Hugging Face transformer embeddings)
pipeline:
  # 1. Tokenize on whitespace (handles English + Malay well)
- name: WhitespaceTokenizer

  # 2. Regex-based features (order_id, city lookups)
- name: RegexFeaturizer

  # 3. Hugging Face transformer embeddings
- name: LanguageModelFeaturizer
  model_name: bert
  model_weights: sentence-transformers/all-MiniLM-L6-v2

  # 4. Joint intent classifier + entity extractor
- name: DIETClassifier
  epochs: 100
  entity_recognition: true

  # 5. Merge entity synonyms
- name: EntitySynonymMapper

  # 6. Response selector for FAQ-style retrieval intents
- name: ResponseSelector
  epochs: 100

  # 7. Fallback when classifier confidence is below threshold
- name: FallbackClassifier
  threshold: 0.4

# DIALOGUE POLICIES
policies:
- name: MemoizationPolicy
  max_history: 5

- name: RulePolicy
  core_fallback_threshold: 0.30
  core_fallback_action_name: "action_default_fallback"
  enable_fallback_prediction: true

- name: TEDPolicy
  max_history: 10
  epochs: 200
  constrain_similarities: true

- name: UnexpecTEDIntentPolicy
  max_history: 5
  epochs: 200
