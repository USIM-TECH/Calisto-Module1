# ============================================================
# Calisto Eyewear (Malaysia) - Rasa NLU + Core Configuration
# ============================================================
# Run: rasa train   |   Chat: rasa shell
# Serve actions: rasa run actions
# ============================================================

recipe: default.v1

# Supports English + Manglish + Bahasa Melayu mixed input
language: en

# NLU PIPELINE (tuned for Malaysian multilingual input)
pipeline:
  # 1. Tokenize on whitespace (handles English + Malay well)
- name: WhitespaceTokenizer
  intent_tokenization_flag: false
  intent_split_symbol: "_"

  # 2. Regex-based features (order_id, city lookups)
- name: RegexFeaturizer
  case_sensitive: false

  # 2b. Extract regex and lookup-based entities such as budget and brands
- name: RegexEntityExtractor
  use_lookup_tables: true
  use_regexes: true
  use_word_boundaries: true

  # 3. Lexical / syntactic features
- name: LexicalSyntacticFeaturizer

  # 4. Bag-of-words word-level features
- name: CountVectorsFeaturizer
  OOV_token: "__oov__"

  # 5. Character n-gram features (critical for Manglish/Malay typos)
- name: CountVectorsFeaturizer
  analyzer: char_wb
  min_ngram: 1
  max_ngram: 4
  OOV_token: "__oov__"

  # 6. Joint intent classifier + entity extractor (increased epochs)
- name: DIETClassifier
  epochs: 200
  constrain_similarities: true
  entity_recognition: true
  use_masked_language_model: false
  learning_rate: 0.001
  batch_size: [64, 256]
  number_of_transformer_layers: 2
  drop_rate: 0.2
  weight_sparsity: 0.8

  # 7. Merge entity synonyms
- name: EntitySynonymMapper

  # 8. Response selector for FAQ-style retrieval intents
- name: ResponseSelector
  epochs: 200
  constrain_similarities: true
  retrieval_intent: chitchat

  # 9. Fallback when classifier confidence is below threshold
- name: FallbackClassifier
  threshold: 0.40
  ambiguity_threshold: 0.10

# DIALOGUE POLICIES
policies:
- name: MemoizationPolicy
  max_history: 5

- name: RulePolicy
  core_fallback_threshold: 0.30
  core_fallback_action_name: "action_default_fallback"
  enable_fallback_prediction: true

- name: TEDPolicy
  max_history: 10
  epochs: 200
  constrain_similarities: true

- name: UnexpecTEDIntentPolicy
  max_history: 5
  epochs: 200
