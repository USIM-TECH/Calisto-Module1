# ============================================================
# Calisto Eyewear – Channel Credentials
# ============================================================
# Replace placeholder tokens with real values before deploying.
# ============================================================

# ── REST (testing & API integrations) ───────────────────────
rest:

# ── Socket.IO (web widget) ───────────────────────────────────
socketio:
  user_message_evt: user_uttered
  bot_message_evt: bot_uttered
  session_persistence: true

# ── WhatsApp via Twilio ──────────────────────────────────────
# Enable by adding the rasa-twilio package and setting env vars.
twilio:
  account_sid: "${TWILIO_ACCOUNT_SID}"
  auth_token:  "${TWILIO_AUTH_TOKEN}"
  twilio_number: "+1XXXXXXXXXX"

# ── Facebook Messenger / Instagram ──────────────────────────
# Enable by adding the rasa-facebook-messenger package.
facebook:
  verify:            "${FB_VERIFY_TOKEN}"
  secret:            "${FB_APP_SECRET}"
  page-access-token: "${FB_PAGE_ACCESS_TOKEN}"
