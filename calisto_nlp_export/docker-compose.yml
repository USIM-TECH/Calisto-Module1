# ============================================================
# Calisto Eyewear – Docker Compose
# ============================================================
# Runs Rasa NLP server + Action server in Docker containers.
# Compatible with any host Python version.
#
# Usage:
#   docker compose up -d        → start services
#   docker compose down         → stop services
#   docker compose logs -f      → follow logs
# ============================================================

services:
  # ── Rasa NLP Server ──────────────────────────────────────
  rasa:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["rasa"]
    command:
      - run
      - --enable-api
      - --cors
      - "*"
      - --endpoints
      - endpoints.docker.yml
      - --credentials
      - credentials.yml
      - --port
      - "5005"
    ports:
      - "5005:5005"
    depends_on:
      - action-server
    volumes:
      - ./models:/app/models
    networks:
      - calisto-net

  # ── Rasa Action Server ──────────────────────────────────
  action-server:
    build:
      context: .
      dockerfile: Dockerfile.actions
    ports:
      - "5055:5055"
    networks:
      - calisto-net
    # Reach the host's Node integration service (chatbot-integrations on
    # localhost:3000). Without this, ServiceGateway falls back to the CSV.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Host machine URL for chatbot-integrations (must match PORT in chatbot-integrations/.env).
      BACKEND_API_BASE_URL: "http://host.docker.internal:3000"
      # Base URL for absolutising /static/... product images in emit_product_card.
      # Do not use ${VAR:-http://...} here: defaults with ":" break Compose interpolation.
      # Override for a public tunnel, e.g.:
      #   PUBLIC_BASE_URL=https://your-subdomain.trycloudflare.com docker compose up -d
      PUBLIC_BASE_URL: "http://host.docker.internal:3000"

networks:
  calisto-net:
    driver: bridge
