# ============================================================
# Calisto Eyewear – Docker Compose
# ============================================================
# Runs Rasa NLP server + Action server in Docker containers.
# Compatible with any host Python version.
#
# Usage:
#   docker compose up -d        → start services
#   docker compose down         → stop services
#   docker compose logs -f      → follow logs
# ============================================================

services:
  # ── Rasa NLP Server ──────────────────────────────────────
  rasa:
    platform: linux/arm64
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["rasa"]
    command:
      - run
      - --model
      - /app/models/20260320-191439-beige-sill.tar.gz
      - --enable-api
      - --cors
      - "*"
      - --endpoints
      - endpoints.docker.yml
      - --credentials
      - credentials.yml
      - --port
      - "5015"
    ports:
      - "5015:5015"
    depends_on:
      - action-server
    volumes:
      - ./models:/app/models
    networks:
      - calisto-net
    deploy:
      resources:
        limits:
          memory: 4096M
          cpus: '2.0'

  # ── Rasa Action Server ──────────────────────────────────
  action-server:
    build:
      context: .
      dockerfile: Dockerfile.actions
    ports:
      - "5055:5055"
    networks:
      - calisto-net
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.0'

  reasoning-server:
    build:
      context: .
      dockerfile: Dockerfile.reasoning
    ports:
      - "8008:8008"
    networks:
      - calisto-net

networks:
  calisto-net:
    driver: bridge
