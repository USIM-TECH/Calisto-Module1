# ============================================================
# Calisto Eyewear – Docker Compose
# ============================================================
# Runs Rasa NLP server + Action server in Docker containers.
# Compatible with any host Python version.
#
# Usage:
#   docker compose up -d        → start services
#   docker compose down         → stop services
#   docker compose logs -f      → follow logs
# ============================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: calisto_kb
      POSTGRES_USER: calisto
      POSTGRES_PASSWORD: calisto
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calisto -d calisto_kb"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - calisto-net

  # ── Rasa NLP Server ──────────────────────────────────────
  rasa:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5005:5005"
    depends_on:
      action-server:
        condition: service_healthy
    volumes:
      - ./models:/app/models
    environment:
      - ACTION_ENDPOINT_URL=http://action-server:5055/webhook
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5005/status', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - calisto-net

  # ── Rasa Action Server ──────────────────────────────────
  action-server:
    build:
      context: .
      dockerfile: Dockerfile.actions
    restart: unless-stopped
    command: ["start", "--actions", "actions.actions", "--port", "5055"]
    ports:
      - "5055:5055"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ACTIONS_MODULE: actions.actions
      KB_DB_HOST: postgres
      KB_DB_PORT: 5432
      KB_DB_NAME: calisto_kb
      KB_DB_USER: calisto
      KB_DB_PASSWORD: calisto
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5055/actions', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - calisto-net

networks:
  calisto-net:
    driver: bridge

volumes:
  postgres-data:
