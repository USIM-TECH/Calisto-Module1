# ============================================================
# Calisto Eyewear – Docker Compose
# ============================================================
# Runs Rasa NLP server + Action server in Docker containers.
# Compatible with any host Python version.
#
# Usage:
#   docker compose up -d        → start services
#   docker compose down         → stop services
#   docker compose logs -f      → follow logs
# ============================================================

services:
  # ── Rasa NLP Server ──────────────────────────────────────
  rasa:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -lc 'LATEST_MODEL=$$(ls -t /app/models/*.tar.gz | head -n1) &&
      exec rasa run --enable-api --cors "*" --model "$$LATEST_MODEL" --endpoints endpoints.docker.yml --credentials credentials.yml --port 5005'
    ports:
      - "5005:5005"
    depends_on:
      - action-server
    volumes:
      - ./models:/app/models
    networks:
      - calisto-net

  # ── Rasa Action Server ──────────────────────────────────
  action-server:
    build:
      context: .
      dockerfile: Dockerfile.actions
    ports:
      - "5055:5055"
    networks:
      - calisto-net

networks:
  calisto-net:
    driver: bridge
