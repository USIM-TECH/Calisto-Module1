      - [brown](frame_color) frames please
      - searching for [square](frame_shape) eyeglasses
      - what [cat-eye](frame_shape) glasses do you have?
      - I prefer [gold](frame_color) frames
      - show me [metal](frame_material) glasses in [blue](frame_color)
      - I am looking for [rectangle](frame_shape) frames
      - any [green](frame_color) glasses?
      - i want to see [black](frame_color) [round](frame_shape) glasses
      - [yellow](frame_color) colour spectacles

  - intent: inform_budget
    examples: |
      - my budget is [100](budget)
      - around [250](budget) dollars
      - i can spend [500](budget)
      - [300](budget)
  - intent: ask_faq
    examples: |
      - what is your return policy?
      - do you offer refunds?
      - how long can I return my glasses?
      - what is the warranty on frames?
      - can I exchange my sunglasses?
      - what are your store policies?
      - shipping times and costs?
      - do you have a warranty?
      - how to claim a refund
      - return policy
      - FAQ
      - what happens if my glasses break?
