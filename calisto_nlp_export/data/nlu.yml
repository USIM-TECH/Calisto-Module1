version: "3.1"

nlu:
  - intent: greet
    examples: |
      - hello
      - hi
      - hey
      - hello there
      - good morning
      - greeting

  - intent: browse_eyewear
    examples: |
      - Browse Eyewear
      - I want to browse eyewear
