version: "3.1"

nlu:
  - intent: greet
    examples: |
      - hello
      - hi
      - hey
      - hello there
      - good morning
      - greeting

  - intent: browse_eyewear
    examples: |
      - Browse Eyewear
      - I want to browse eyewear
      - show me glasses
      - looking for eyewear

  - intent: lens_vision_solutions
    examples: |
      - Lens & Vision Solutions
      - show me lens options
      - I need lenses

  - intent: find_a_store
    examples: |
      - Find a Store
      - find nearest store
      - store locator

  - intent: select_product_type
    examples: |
      - Designer Frames
      - Luxury Sunglasses
      - Contact Lenses
      - Daily Lenses
      - Monthly Lenses
      - Multifocal Lenses
      - I want [Designer Frames](product_type)
      - show me [Luxury Sunglasses](product_type)

  - intent: select_brand
    examples: |
      - Bottega Veneta
      - Projekt Produkt
      - Bossini
      - Show All Brands
      - Gucci
      - Saint Laurent
      - Cartier
      - I am looking for [Gucci](brand)

  - intent: select_budget
    examples: |
      - Under RM100
      - RM100 - RM250
      - RM250 - RM300
      - Above RM300
      - my budget is [Under RM100](price_range)

  - intent: ask_lens_type
    examples: |
      - Single Vision Lenses
      - Progressive Lenses
      - Blue Light Protection
      - Photochromic Lenses

  - intent: choose_city
    examples: |
      - Aeon Mall Nilai
      - Lalaport Bukit Bintang
      - Melawati Mall
      - Mitsui Outlet Park
      - [Aeon Mall Nilai](city)
