      - Photochromic Lenses

  - intent: choose_city
    examples: |
      - Aeon Mall Nilai
      - Lalaport Bukit Bintang
      - Melawati Mall
      - Mitsui Outlet Park
      - [Aeon Mall Nilai](city)

  - intent: search_product_by_attribute
    examples: |
      - i need [blue](frame_color) color glasses
      - looking for [rectangular](frame_shape) framed glasses
      - do you have [black](frame_color) frames
      - show me [round](frame_shape) glasses
