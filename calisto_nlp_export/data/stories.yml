version: "3.1"

stories:
  - story: Browse Eyewear - Designer Frames Flow
    steps:
      - intent: greet
      - action: utter_greet
      - intent: browse_eyewear
      - action: action_reset_eyewear_slots
      - action: utter_ask_product_type
      - intent: select_product_type
        entities:
          - product_type: "Designer Frames"
      - slot_was_set:
          - product_type: "Designer Frames"
      - action: utter_ask_brand_designer_frames
      - intent: select_brand
      - slot_was_set:
          - brand
      - action: utter_ask_budget_range
      - intent: select_budget
      - slot_was_set:
          - price_range
      - action: action_filter_products
      - action: utter_ask_try_frames

  - story: Browse Eyewear - Luxury Sunglasses Flow
    steps:
      - intent: greet
      - action: utter_greet
      - intent: browse_eyewear
      - action: action_reset_eyewear_slots
      - action: utter_ask_product_type
      - intent: select_product_type
        entities:
          - product_type: "Luxury Sunglasses"
      - slot_was_set:
          - product_type: "Luxury Sunglasses"
      - action: utter_ask_brand_luxury_sunglasses
      - intent: select_brand
      - slot_was_set:
          - brand
      - action: utter_ask_budget_range
      - intent: select_budget
      - slot_was_set:
          - price_range
      - action: action_filter_products
      - action: utter_ask_try_frames

  - story: Browse Eyewear - Contact Lenses Flow
    steps:
      - intent: greet
      - action: utter_greet
      - intent: browse_eyewear
      - action: action_reset_eyewear_slots
      - action: utter_ask_product_type
      - intent: select_product_type
        entities:
