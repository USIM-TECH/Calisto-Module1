version: "3.1"

rules:
  - rule: Greet user at any time
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Start eyewear browse flow
    steps:
      - intent: browse_eyewear
      - action: action_reset_eyewear_slots
      - action: utter_ask_product_type

  - rule: Start pricing flow
    steps:
      - intent: ask_pricing
      - action: utter_pricing_intro

  - rule: Product type selected for eyewear
    steps:
      - intent: select_product_type
      - action: action_ask_brand

  - rule: Start lens and vision flow
    steps:
      - intent: lens_vision_solutions
      - action: utter_ask_lens_type

  - rule: Lens type selected
    steps:
      - intent: ask_lens_type
      - action: action_explain_lens
      - action: utter_ask_budget_range

  - rule: Find a store generic
    steps:
      - intent: find_a_store
      - action: action_ask_city

  - rule: Choose city for store
    steps:
      - intent: choose_city
      - action: action_find_store

  - rule: FAQ fallback to knowledge base
    steps:
      - intent: ask_faq
      - action: action_document_search

  - rule: Search product by attribute
    steps:
      - intent: search_product_by_attribute
      - action: action_search_product_by_attribute

  - rule: Start lead capture from booking
    steps:
      - intent: book_appointment
      - action: utter_booking_intro
      - action: lead_capture_form
      - active_loop: lead_capture_form

  - rule: Start lead capture directly
    steps:
      - intent: capture_lead
      - action: lead_capture_form
      - active_loop: lead_capture_form

  - rule: Continue lead capture from service interest
    steps:
      - intent: share_service_interest
      - action: lead_capture_form
      - active_loop: lead_capture_form

  - rule: Start lead capture for after sales
    steps:
      - intent: after_sales_support
      - action: utter_after_sales_intro
      - action: lead_capture_form
      - active_loop: lead_capture_form

  - rule: Submit lead capture form
    condition:
      - active_loop: lead_capture_form
    steps:
      - action: lead_capture_form
      - active_loop: null
      - action: action_qualify_lead
      - action: action_submit_lead_capture
