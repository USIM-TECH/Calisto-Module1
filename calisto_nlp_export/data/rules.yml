version: "3.1"

rules:
  - rule: Handle email support
    steps:
      - intent: email_support
      - action: utter_email_support
  - rule: Greet user at any time
    steps:
      - intent: greet
      - action: action_set_language
      - action: action_handle_greet

  - rule: Interrupt lead capture for FAQ
    condition:
      - active_loop: lead_capture_form
    steps:
      - intent: ask_faq
      - action: action_set_language
      - action: action_handle_lead_capture_interruption

  - rule: Interrupt lead capture for pricing intro
    condition:
      - active_loop: lead_capture_form
    steps:
      - intent: ask_pricing
      - action: action_set_language
      - action: action_handle_lead_capture_interruption

  - rule: Interrupt lead capture for pricing category
    condition:
      - active_loop: lead_capture_form
    steps:
      - intent: select_pricing_category
      - action: action_set_language
      - action: action_handle_lead_capture_interruption

  - rule: Interrupt lead capture for browsing
    condition:
      - active_loop: lead_capture_form
    steps:
      - intent: browse_eyewear
      - action: action_set_language
      - action: action_handle_lead_capture_interruption

  - rule: Interrupt lead capture for product type selection
    condition:
      - active_loop: lead_capture_form
    steps:
      - intent: select_product_type
      - action: action_set_language
      - action: action_handle_lead_capture_interruption

  - rule: Interrupt lead capture for brand selection
    condition:
      - active_loop: lead_capture_form
    steps:
      - intent: select_brand
      - action: action_set_language
      - action: action_handle_lead_capture_interruption

  - rule: Interrupt lead capture for budget selection
    condition:
      - active_loop: lead_capture_form
    steps:
      - intent: select_budget
      - action: action_set_language
      - action: action_handle_lead_capture_interruption

  - rule: Interrupt lead capture for lens flows
    condition:
      - active_loop: lead_capture_form
    steps:
      - intent: lens_vision_solutions
      - action: action_set_language
      - action: action_handle_lead_capture_interruption

  - rule: Interrupt lead capture for lens detail
    condition:
      - active_loop: lead_capture_form
    steps:
      - intent: ask_lens_type
      - action: action_set_language
      - action: action_handle_lead_capture_interruption

  - rule: Interrupt lead capture for store lookup
    condition:
      - active_loop: lead_capture_form
    steps:
      - intent: find_a_store
      - action: action_set_language
      - action: action_handle_lead_capture_interruption

  - rule: Interrupt lead capture for store hours
    condition:
      - active_loop: lead_capture_form
    steps:
      - intent: store_hours
      - action: action_set_language
      - action: action_handle_lead_capture_interruption

  - rule: Interrupt lead capture for city selection
    condition:
      - active_loop: lead_capture_form
    steps:
      - intent: choose_city
      - action: action_set_language
      - action: action_handle_lead_capture_interruption

  - rule: Interrupt lead capture for product search
    condition:
      - active_loop: lead_capture_form
    steps:
      - intent: search_product
      - action: action_set_language
      - action: action_handle_lead_capture_interruption

  - rule: Interrupt lead capture for attribute search
    condition:
      - active_loop: lead_capture_form
    steps:
      - intent: search_product_by_attribute
      - action: action_set_language
      - action: action_handle_lead_capture_interruption

  - rule: Interrupt lead capture for recommendations
    condition:
      - active_loop: lead_capture_form
    steps:
      - intent: product_recommendation
      - action: action_set_language
      - action: action_handle_lead_capture_interruption

  - rule: Interrupt lead capture for budget refinement
    condition:
      - active_loop: lead_capture_form
    steps:
      - intent: inform_budget
      - action: action_set_language
      - action: action_handle_lead_capture_interruption

  - rule: Start eyewear browse flow
    steps:
      - intent: browse_eyewear
      - action: action_set_language
      - action: action_reset_eyewear_slots
      - action: utter_ask_product_type

  - rule: Start pricing flow
    steps:
      - intent: ask_pricing
      - action: action_set_language
      - action: utter_pricing_intro

  - rule: Show pricing for selected category
    steps:
      - intent: select_pricing_category
      - action: action_set_language
      - action: action_show_pricing

  - rule: Product type selected for eyewear
    steps:
      - intent: select_product_type
      - action: action_set_language
      - action: action_ask_brand

  - rule: Start lens and vision flow
    steps:
      - intent: lens_vision_solutions
      - action: action_set_language
      - action: utter_ask_lens_type

  - rule: Lens type selected
    steps:
      - intent: ask_lens_type
      - action: action_set_language
      - action: action_explain_lens
      - action: action_ask_budget_range

  - rule: Find a store generic
    steps:
      - intent: find_a_store
      - action: action_set_language
      - action: action_ask_city

  - rule: Answer store hours
    steps:
      - intent: store_hours
      - action: action_set_language
      - action: action_handle_store_hours

  - rule: Choose city for store
    steps:
      - intent: choose_city
      - action: action_set_language
      - action: action_find_store

  - rule: FAQ fallback to knowledge base
    steps:
      - intent: ask_faq
      - action: action_set_language
      - action: action_document_search

  - rule: Search product by attribute
    steps:
      - intent: search_product_by_attribute
      - action: action_set_language
      - action: action_search_product_by_attribute

  - rule: Search product with combined filters
    steps:
      - intent: search_product
      - action: action_set_language
      - action: action_filter_products

  - rule: Recommend products by use case
    steps:
      - intent: product_recommendation
      - action: action_set_language
      - action: action_recommend_products

  - rule: Handle book appointment
    steps:
      - intent: book_appointment
      - action: action_set_language
      - action: action_book_appointment

  - rule: Start lead capture directly
    steps:
      - intent: capture_lead
      - action: action_set_language
      - action: action_prefill_lead_capture
      - action: lead_capture_form
      - active_loop: lead_capture_form

  - rule: Continue lead capture from service interest
    steps:
      - intent: share_service_interest
      - action: action_set_language
      - action: action_prefill_lead_capture
      - action: lead_capture_form
      - active_loop: lead_capture_form

  - rule: Start lead capture for after sales
    steps:
      - intent: after_sales_support
      - action: action_set_language
      - action: utter_after_sales_intro
      - action: action_prefill_lead_capture
      - action: lead_capture_form
      - active_loop: lead_capture_form

  - rule: Start lead capture for order tracking
    steps:
      - intent: order_tracking
      - action: action_set_language
      - action: utter_order_tracking_intro
      - action: action_prefill_lead_capture
      - action: lead_capture_form
      - active_loop: lead_capture_form

  - rule: Start lead capture for human handoff
    steps:
      - intent: human_handoff
      - action: action_set_language
      - action: utter_handoff_intro
      - action: action_prefill_lead_capture
      - action: lead_capture_form
      - active_loop: lead_capture_form

  - rule: Start lead capture for appointment reschedule
    steps:
      - intent: reschedule_appointment
      - action: action_set_language
      - action: utter_reschedule_intro
      - action: action_prefill_lead_capture
      - action: lead_capture_form
      - active_loop: lead_capture_form

  - rule: Submit lead capture form
    condition:
      - active_loop: lead_capture_form
    steps:
      - action: lead_capture_form
      - active_loop: null
      - action: action_qualify_lead
      - action: action_submit_lead_capture

  - rule: prioritize return support
    steps:
      - intent: return_request
      - action: action_set_language
      - action: action_handle_return_support

  - rule: prioritize refund support
    steps:
      - intent: refund_request
      - action: action_set_language
      - action: action_handle_refund_support

  - rule: prioritize repair support
    steps:
      - intent: repair_support
      - action: action_set_language
      - action: action_handle_repair_support

  - rule: prioritize exchange support
    steps:
      - intent: exchange_request
      - action: action_set_language
      - action: action_handle_exchange_support

  - rule: prioritize warranty support
    steps:
      - intent: warranty_support
      - action: action_set_language
      - action: action_handle_warranty_support

  - rule: prioritize order support
    steps:
      - intent: order_support
      - action: action_set_language
      - action: action_handle_order_support

  - rule: Support and policies menu
    steps:
      - intent: support_and_policies
      - action: action_set_language
      - action: utter_support_policies_menu

  - rule: Interrupt lead capture for support and policies
    condition:
      - active_loop: lead_capture_form
    steps:
      - intent: support_and_policies
      - action: action_set_language
      - action: action_handle_lead_capture_interruption

  - rule: Ask a question menu
    steps:
      - intent: ask_a_question
      - action: action_set_language
      - action: utter_ask_a_question_menu

  - rule: Interrupt lead capture for ask a question
    condition:
      - active_loop: lead_capture_form
    steps:
      - intent: ask_a_question
      - action: action_set_language
      - action: action_handle_lead_capture_interruption

  - rule: Support actions menu
    steps:
      - intent: support_actions
      - action: action_set_language
      - action: utter_support_actions_menu

  - rule: Warranty policy inquiry
    steps:
      - intent: warranty_policy_inquiry
      - action: action_set_language
      - action: utter_warranty_policy_menu

  - rule: Return policy inquiry
    steps:
      - intent: return_policy_inquiry
      - action: action_set_language
      - action: utter_return_policy_menu

  - rule: Ask availability inquiry
    steps:
      - intent: ask_availability
      - action: action_set_language
      - action: action_document_search
