# Temporary Postgres for one-time migration into MySQL (uses existing calisto-postgres-data volume).
# Start: docker compose -f docker-compose.postgres-import.yml up -d
# Stop:  docker compose -f docker-compose.postgres-import.yml down

services:
  postgres:
    image: postgres:16-alpine
    container_name: calisto-postgres-import
    environment:
      POSTGRES_USER: calisto
      POSTGRES_PASSWORD: calisto
      POSTGRES_DB: calisto_chatbot
    ports:
      - "5432:5432"
    volumes:
      - calisto-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calisto -d calisto_chatbot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  calisto-postgres-data:
